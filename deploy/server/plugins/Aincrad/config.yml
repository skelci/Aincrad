# Aincrad Paper Plugin Configuration
# Plugin: com.aincrad.paper

database:
  type: sqlite  # Options: sqlite, mysql, postgresql
  sqlite:
    file: "aincrad.db"
  mysql:
    host: localhost
    port: 3306
    database: aincrad
    username: aincrad
    password: "change_me"
  postgresql:
    host: localhost
    port: 5432
    database: aincrad
    username: aincrad
    password: "change_me"

guild:
  enabled: true
  max-members: 50
  max-guilds: 1000
  min-name-length: 3
  max-name-length: 16
  creation-cost: 1000
  invite-expiry-minutes: 10
  rank-count: 5

party:
  enabled: true
  max-members: 5
  invite-expiry-minutes: 5
  auto-kick-idle-minutes: 30
  idle-threshold-minutes: 60

quest:
  enabled: true
  daily-quest-count: 3
  weekly-quest-count: 5
  max-active-quests: 5
  quest-expiry-days: 7

economy:
  enabled: true
  currency-name: "Cor"
  currency-symbol: "C"
  starting-balance: 1000
  max-balance: 100000000
  daily-reward: 500
  death-penalty-percent: 5

dungeon:
  enabled: true
  max-players-per-dungeon: 4
  instance-timeout-minutes: 30
  respawn-delay-seconds: 5
  max-floors: 100
  difficulty-scaling: true

progression:
  enabled: true
  max-level: 100
  exp-curve: "quadratic"  # linear, quadratic, exponential
  stat-points-per-level: 5
  skill-points-per-level: 1
  death-penalty: true
  keep-inventory-on-death: false

matchmaking:
  enabled: true
  max-queue-size: 100
  matchmaking-timeout-seconds: 120
  min-players-to-start: 1
  rating-system: "elo"

world:
  spawn-world: "world"
  safe-spawn: true
  spawn-radius: 100
  pvp-arena-world: "world_arena"
  lobby-world: "world_lobby"

balance:
  pvp-enabled: true
  pve-enabled: true
  damage-multiplier: 1.0
  defense-multiplier: 1.0
  exp-multiplier: 1.0
  drop-multiplier: 1.0

logging:
  level: INFO  # DEBUG, INFO, WARN, ERROR
  log-player-actions: true
  log-chat: true
  log-economy: true
  log-combat: false
