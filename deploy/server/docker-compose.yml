services:
  aincrad-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: aincrad-server:latest
    container_name: aincrad-server
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    stop_grace_period: "120s"
    ports:
      - "25566:25565/tcp"
      - "25575:25575/tcp"
    volumes:
      - ./logs:/server/logs
      - ./data:/server/data
      - ./world:/server/world
      - ./bukkit.yml:/server/bukkit.yml
      - ./world_nether:/server/world_nether
      - ./world_the_end:/server/world_the_end
      - ./datapacks:/server/world/datapacks:ro
      - ./datapacks:/server/world_nether/datapacks:ro
      - ./mods:/server/mods:ro
      - ./plugins:/server/plugins
      - ./ops.json:/server/ops.json
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 4G
