services:
  aincrad-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: aincrad-server:latest
    container_name: aincrad-server
    restart: unless-stopped
    ports:
      - "25566:25565"
    volumes:
      - ./logs:/server/logs
      - ./data:/server/data
      - ./datapacks:/server/world/datapacks:ro
      - ./mods:/server/mods:ro
      - ./plugins:/server/plugins:ro
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 4G
