plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = '0.1.0'
group = 'com.aincrad'

base { archivesName = 'aincrad' }

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.162.0+26.3'
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('jar') {
    manifest {
        attributes(
            'Implementation-Title': 'Aincrad',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'com.aincrad',
            'Fabric-Mod': 'true'
        )
    }
}

// Paper plugin jar task
tasks.register('paperPluginJar', Jar) {
    archiveClassifier.set('paper-plugin')
    from(sourceSets.main.output) {
        include 'com/aincrad/paper/**'
    }
    from('src/main/resources') {
        include 'paper-plugin.yml'
    }
    manifest {
        attributes(
            'Implementation-Title': 'Aincrad Paper Plugin',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'com.aincrad',
            'Main-Class': 'com.aincrad.paper.AincradPaperPlugin',
            'Plugin-Name': 'Aincrad',
            'Plugin-Version': project.version,
            'Plugin-API-Version': '1.21',
            'Plugin-Load': 'STARTUP',
            'Plugin-Authors': 'skelci'
        )
    }
}

tasks.named('build') {
    dependsOn 'paperPluginJar'
}