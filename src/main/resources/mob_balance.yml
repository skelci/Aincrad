# Aincrad Mob Balance Configuration
# Per-theme multipliers for HP, damage, and speed.
# Theme indices are 0-based (0 = Forest, 9 = Final Tower).

themes:
  Forest:
    hp: 1.0
    dmg: 1.0
    spd: 1.0
  Cave:
    hp: 1.1
    dmg: 1.1
    spd: 1.0
  Ice:
    hp: 1.2
    dmg: 1.2
    spd: 1.1
  Desert:
    hp: 1.3
    dmg: 1.3
    spd: 1.1
  Volcano:
    hp: 1.4
    dmg: 1.4
    spd: 1.0
  Ocean:
    hp: 1.5
    dmg: 1.5
    spd: 1.2
  Mountain:
    hp: 1.6
    dmg: 1.6
    spd: 1.0
  Swamp:
    hp: 1.7
    dmg: 1.7
    spd: 1.1
  Crystal:
    hp: 1.8
    dmg: 1.8
    spd: 1.2
  Final Tower:
    hp: 2.0
    dmg: 2.0
    spd: 1.2

# Floor-based scaling: HP multiplier = 1 + (floor - 1) * floorHpStep
floorScaling:
  hpStep: 0.15
  dmgStep: 0.10
  spdStep: 0.02
